[package]
name = "argo-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.2"
capnp = "0.20"
capnp-futures = "0.20"
capnp-rpc = "0.20"
clap = { version = "4.6.8", features = ["derive"] }
futures = "0.3.34"
hickory-resolver = "0.26.3"
h2 = "0.4.20"
http = "1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "platform-verifier", "log", "bloom", "futures-io"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "tls12", "logging", "std"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webpki-roots = "1.0.12"

[build-dependencies]
capnpc = "0.20"
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
opt-level = 2
